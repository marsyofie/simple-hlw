name: Deploy AWS

on:
  push:
    branches:
      - main
    paths-ignore:
      - '.github/**'
permissions:
  id-token: write
  contents: read

jobs:
  changes:
    name: Check changed files
    runs-on: ubuntu-latest
    outputs:
      infra: ${{ steps.filter.outputs.infra }}
      app: ${{ steps.filter.outputs.app }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect changes
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            infra:
              - 'infra/**'
            app:
              - 'app/**'

  deploy-infra:
    name: Deploy infra
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: infra/package-lock.json

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-duration-seconds: 1800
          aws-region: ap-southeast-1

      - name: Install dependencies
        working-directory: infra
        run: npm ci

      - name: Build infra
        working-directory: infra
        run: npm run build

      - name: Deploy infra stack
        working-directory: infra
        run: npx cdk deploy "shwInfraStack/*" --require-approval never

  deploy-app:
    name: Deploy app
    runs-on: ubuntu-latest
    needs:
      - changes
      - deploy-infra
    if: |
      always() &&
      needs.changes.outputs.app == 'true' &&
      (needs.deploy-infra.result == 'success' || needs.deploy-infra.result == 'skipped')
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/_cdk/package-lock.json

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-duration-seconds: 1800
          aws-region: ap-southeast-1

      - name: Install app CDK dependencies
        working-directory: app/_cdk
        run: npm ci

      - name: Build app CDK
        working-directory: app/_cdk
        run: npm run build

      - name: Deploy app stack
        working-directory: app/_cdk
        run: npx cdk deploy ShwAppStack --require-approval never
